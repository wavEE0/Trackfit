name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ───────────────────────────────────────────────
  # 1. Unit & integration tests (Django test runner)
  # ───────────────────────────────────────────────
  test:
    name: Run pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: trackfit_db
          POSTGRES_USER: trackfit_user
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: trackfit/requirements.prod.txt
      - name: Install Python dependencies
        run: pip install -r trackfit/requirements.prod.txt
      - name: Run database migrations
        working-directory: trackfit
        env:
          SECRET_KEY: ci-key-not-for-production
          DEBUG: "True"
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: trackfit_db
          DB_USER: trackfit_user
          DB_PASSWORD: testpassword
          AUTH0_CLIENT_ID: ci-placeholder
          AUTH0_CLIENT_SECRET: ci-placeholder
          AUTH0_DOMAIN: ci-placeholder.auth0.com
          ALLOWED_HOSTS: localhost
        run: python manage.py migrate --noinput
      - name: Run unit tests
        working-directory: trackfit
        env:
          SECRET_KEY: ci-key-not-for-production
          DEBUG: "True"
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: trackfit_db
          DB_USER: trackfit_user
          DB_PASSWORD: testpassword
          AUTH0_CLIENT_ID: ci-placeholder
          AUTH0_CLIENT_SECRET: ci-placeholder
          AUTH0_DOMAIN: ci-placeholder.auth0.com
          ALLOWED_HOSTS: localhost
        run: python manage.py test nutrition --verbosity 2

  # ───────────────────────────────────────────────
  # 2. End-to-end tests (Playwright)
  # ───────────────────────────────────────────────
  e2e:
    name: Run Playwright e2e suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: trackfit_db
          POSTGRES_USER: trackfit_user
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: trackfit/requirements.prod.txt
      - name: Install Python dependencies
        run: pip install -r trackfit/requirements.prod.txt
      - name: Install pytest-playwright + Chromium
        run: pip install pytest-playwright && playwright install chromium
      - name: Run database migrations
        working-directory: trackfit
        env:
          SECRET_KEY: ci-key-not-for-production
          DEBUG: "True"
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: trackfit_db
          DB_USER: trackfit_user
          DB_PASSWORD: testpassword
          AUTH0_CLIENT_ID: ci-placeholder
          AUTH0_CLIENT_SECRET: ci-placeholder
          AUTH0_DOMAIN: ci-placeholder.auth0.com
          ALLOWED_HOSTS: localhost
        run: python manage.py migrate --noinput
      - name: Seed e2e user
        working-directory: trackfit
        env:
          SECRET_KEY: ci-key-not-for-production
          DEBUG: "True"
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: trackfit_db
          DB_USER: trackfit_user
          DB_PASSWORD: testpassword
          AUTH0_CLIENT_ID: ci-placeholder
          AUTH0_CLIENT_SECRET: ci-placeholder
          AUTH0_DOMAIN: ci-placeholder.auth0.com
          ALLOWED_HOSTS: localhost
        run: >-
          python manage.py shell -c
          "from django.contrib.auth.models import User;
          User.objects.filter(username='e2e').exists() or
          User.objects.create_superuser('e2e', 'e2e@test.com', 'e2epassword')"
      - name: Start Django on :8000
        working-directory: trackfit
        env:
          SECRET_KEY: ci-key-not-for-production
          DEBUG: "True"
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: trackfit_db
          DB_USER: trackfit_user
          DB_PASSWORD: testpassword
          AUTH0_CLIENT_ID: ci-placeholder
          AUTH0_CLIENT_SECRET: ci-placeholder
          AUTH0_DOMAIN: ci-placeholder.auth0.com
          ALLOWED_HOSTS: localhost
        run: python manage.py runserver 0.0.0.0:8000 &
      - name: Run e2e tests
        working-directory: trackfit
        env:
          SECRET_KEY: ci-key-not-for-production
          DEBUG: "True"
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: trackfit_db
          DB_USER: trackfit_user
          DB_PASSWORD: testpassword
          AUTH0_CLIENT_ID: ci-placeholder
          AUTH0_CLIENT_SECRET: ci-placeholder
          AUTH0_DOMAIN: ci-placeholder.auth0.com
          ALLOWED_HOSTS: localhost
          BASE_URL: http://localhost:8000
        run: |
          pytest e2e/ -v \
            --screenshot=only-on-failure \
            --tracing=retain-on-failure
      - name: Upload e2e artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artefacts
          path: |
            trackfit/test-results/
            trackfit/playwright-report/

  # ───────────────────────────────────────────────
  # 3. Build & push Docker image to ECR  ← THE GATE
  # ───────────────────────────────────────────────
  build-push:
    name: Build and push to ECR
    needs: [test, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: trackfit
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          echo "image=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
      - name: Summary
        run: echo "Pushed ${{ steps.build.outputs.image }}"
