name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: trackfit_db
          POSTGRES_USER: trackfit_user
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: trackfit/requirements.prod.txt
      - name: Install Python dependencies
        run: pip install -r trackfit/requirements.prod.txt
      - name: Run database migrations
        working-directory: trackfit
        env:
          SECRET_KEY: ci-key-not-for-production
          DEBUG: "True"
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: trackfit_db
          DB_USER: trackfit_user
          DB_PASSWORD: testpassword
          AUTH0_CLIENT_ID: ci-placeholder
          AUTH0_CLIENT_SECRET: ci-placeholder
          AUTH0_DOMAIN: ci-placeholder.auth0.com
          ALLOWED_HOSTS: localhost
        run: python manage.py migrate --noinput
      - name: Run unit tests
        working-directory: trackfit
        env:
          SECRET_KEY: ci-key-not-for-production
          DEBUG: "True"
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: trackfit_db
          DB_USER: trackfit_user
          DB_PASSWORD: testpassword
          AUTH0_CLIENT_ID: ci-placeholder
          AUTH0_CLIENT_SECRET: ci-placeholder
          AUTH0_DOMAIN: ci-placeholder.auth0.com
          ALLOWED_HOSTS: localhost
        run: python manage.py test nutrition --verbosity 2
