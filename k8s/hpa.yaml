# horizontal pod autoscaler - scales replicas up when cpu gets busy
# min 2 pods so there is always some redundancy
# max 5 pods so costs dont spiral if something goes wrong
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trackfit-hpa
  namespace: trackfit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trackfit-web
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # scale up when average cpu across pods hits 70%
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
